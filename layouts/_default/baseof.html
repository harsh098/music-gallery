<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101010">
    <meta name="description" content="{{ .Site.Params.description }}">
    <title>{{ .Site.Title }}</title>
    <link rel="icon" href="{{ "images/favicon.svg" | relURL }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    <script src="{{ "js/gallery.js" | relURL }}" defer></script>
  </head>
  <body>
    {{ block "main" . }}{{ end }}
  </body>
</html>
